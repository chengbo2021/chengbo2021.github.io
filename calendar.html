<style>
/* Layout: a cinnabar "almanac" — one big countdown seal on top, then a month-by-month strip of red-ledger rows. */
:root{
  --bg:#fff7f5; --surface:#ffffff; --ink:#2b1412; --muted:#8a5f5a; --line:#f1d9d5;
  --red:#c8161d; --red-soft:#fde8e6; --red-deep:#8f0f14; --gold:#b07a1e; --gold-soft:#fbf0dc;
  --orange:#d9531e; --orange-soft:#fdebe2; --rose:#b7335b; --rose-soft:#fbe6ee; --plum:#7a2e3a; --plum-soft:#f6e6e8;
  --on-red:#fff6ef; --hero:#c8161d;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#170c0b; --surface:#221312; --ink:#f8e9e6; --muted:#c09a94; --line:#3a2120;
  --red:#ff5b55; --red-soft:#3b1716; --red-deep:#ff8f88; --gold:#e3b25a; --gold-soft:#33260f;
  --orange:#ff8a55; --orange-soft:#3a1d10; --rose:#ff7aa2; --rose-soft:#3a1622; --plum:#e59aa6; --plum-soft:#341a1f;
  --on-red:#fff6ef; --hero:#9e1218; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:28px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(28px,6vw,40px);margin:0;letter-spacing:.04em;color:var(--red);text-wrap:balance}
.today{color:var(--muted);font-size:14px}
.today b{color:var(--ink);font-weight:500}
a.doc{color:var(--red);font-size:14px;text-decoration:none;border-bottom:1px solid currentColor}
.topnav{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
a.doc:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* Hero: the next date as a big seal */
.hero{background:var(--hero);color:var(--on-red);border-radius:18px;padding:22px 24px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.08)}
.seal{width:118px;height:118px;border:3px solid var(--on-red);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);line-height:1}
.seal .n{font-size:52px;font-weight:900;font-variant-numeric:tabular-nums}
.seal .u{font-size:14px;margin-top:6px;letter-spacing:.3em;padding-left:.3em}
.hero .eyebrow{font-size:12px;letter-spacing:.2em;opacity:.85}
.hero h2{font-family:var(--serif);font-size:clamp(24px,5vw,32px);margin:2px 0 4px;font-weight:900}
.hero .meta{font-size:14px;opacity:.92}
.hero .also{margin-top:10px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px}
.hero .also span{background:rgba(255,255,255,.14);border-radius:999px;padding:2px 10px}
@media (max-width:520px){.hero{grid-template-columns:1fr;gap:14px}.seal{width:96px;height:96px}.seal .n{font-size:42px}}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .c{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on-red)}
.chip[aria-pressed="true"] .c{color:var(--on-red);opacity:.8}
.chip:hover{border-color:var(--red)}

.allyear{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14px;color:var(--muted);border-left:3px solid var(--gold);padding:4px 0 4px 12px}
.allyear b{color:var(--ink);font-weight:500}

/* Timeline */
.month{display:flex;flex-direction:column;gap:2px}
.month h3{font-family:var(--serif);font-size:18px;margin:0 0 6px;color:var(--red-deep);display:flex;align-items:baseline;gap:10px}
.month h3 small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400}
.row{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;padding:12px 14px;background:var(--surface);border-radius:12px;border:1px solid transparent;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.row+.row{margin-top:6px}

.tag{font-size:11px;font-weight:500;border-radius:4px;padding:1px 6px;letter-spacing:.05em}
.live{font-size:11px;color:var(--red);font-weight:700}
[hidden]{display:none!important}
a.go{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
a.go:hover{color:var(--red);border-bottom-color:var(--red)}
a.go:focus-visible{outline:2px solid var(--red);outline-offset:2px}
a.go .arr{font-size:11px;font-weight:500;color:var(--red);margin-left:6px;white-space:nowrap}

.k-bjsport{background:var(--plum-soft);color:var(--plum)}
.k-bjexpo{background:var(--gold-soft);color:var(--gold)}

.k-fcn,.k-fus,.k-fal,.k-feu,.k-fap{background:var(--surface);color:var(--red-deep);border:1px solid var(--red)}
.k-golf{background:var(--gold);color:var(--surface)}

.k-jzlocal{background:var(--plum);color:var(--surface)}
.k-jzsport{background:var(--surface);color:var(--plum);border:1px solid var(--plum)}
.k-au{background:var(--orange-soft);color:var(--orange);border:1px solid var(--orange)}
.k-auag{background:var(--gold);color:var(--surface)}
.k-nba{background:var(--red-deep);color:var(--surface)}
.k-hawks{background:var(--red);color:var(--on-red)}
.k-bball{background:var(--surface);color:var(--red-deep);border:1px solid var(--red-deep)}
.k-soccer{background:var(--plum);color:var(--surface)}
.k-fam{background:var(--rose-soft);color:var(--rose);border:1px solid var(--rose)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);font-size:14px}
.note{font-size:12px;color:var(--muted);margin:0}
@media (max-width:520px){.row{grid-template-columns:58px 1fr auto;gap:10px;padding:10px 12px}.row .d b{font-size:17px}.row .left b{font-size:18px}}
@media (prefers-reduced-motion:no-preference){.row,.chip{transition:border-color .15s,background .15s}}
</style>

/* Lunar helpers via Intl (with a fix for 2027 正月, which ICU starts a day late) */
let LF=null;try{LF=new Intl.DateTimeFormat('zh-CN-u-ca-chinese',{month:'numeric',day:'numeric',timeZone:'UTC'});}catch(e){}
const CN_M=['正','二','三','四','五','六','七','八','九','十','冬','腊'];
const CN_D=d=>d===10?'初十':d===20?'二十':d===30?'三十':(d<10?'初':d<20?'十':d<30?'廿':'三')+'一二三四五六七八九'[(d%10)-1];
function lunarOf(date){
  if(!LF) return null;
  const t=Date.UTC(date.getFullYear(),date.getMonth(),date.getDate(),12);
  const p=LF.formatToParts(new Date(t));let m=p.find(x=>x.type==='month').value,d=+p.find(x=>x.type==='day').value;
  let leap=m.startsWith('闰');let mm=+m.replace('闰','');
  const iso=ymd(date);
  if(iso==='2027-02-06'){mm=1;d=1;leap=false;}
  else if(iso>'2027-02-06'&&iso<'2027-03-09'&&mm===1&&!leap){d=d+1;}
  return {m:mm,d,leap};
}

    if(TODAY<=e) return {start:s,end:e,live:TODAY>=s};

}
function nextLunar(m,d){

  const tryDay=dd=>{for(let i=0;i<400;i++){const dt=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()+i);const l=lunarOf(dt);if(l&&!l.leap&&l.m===m&&l.d===dd)return dt;}return null;};
  return tryDay(d)||(d===30?tryDay(29):null);
}

function buildItems(){
  const items=[];
  for(const [n,dates] of Object.entries(FEST)){
    const iso=dates.find(s=>s>=ymd(TODAY)); if(!iso) continue;
    const [y,m,d]=iso.split('-').map(Number);const dt=mk(y,m,d);
    items.push({key:n,name:n,kind:'fest',start:dt,realStart:dt,end:dt,live:false,label:null,note:FEST_NOTE[n]});
  }
  for(const lf of LUNAR_FEST){const dt=nextLunar(lf.m,lf.d);if(dt)items.push({key:lf.n,name:lf.n,kind:lf.k||'fest',start:dt,realStart:dt,end:dt,live:false,label:lf.l||null,note:lf.x});}
  for(const ev of EVENTS){const w=nextWindow(ev);const ann=ev.anniv?w.start.getFullYear()-ev.anniv:0;
    items.push({key:ev.n,u:ev.u,ann,name:ann?ev.n+'（'+ann+' 周年）':ev.n,kind:ev.k,start:w.live?TODAY:w.start,realStart:w.start,end:w.end,live:w.live,label:ev.l,note:ev.x,approx:APPROX_L.test(ev.l)||APPROX_X.test(ev.x)});}
  for(const o of ONEOFF){
    const [y,m,d]=o.d.split('-').map(Number);const s0=mk(y,m,d);
    const e0=o.e?(([a,b,c])=>mk(a,b,c))(o.e.split('-').map(Number)):s0;
    if(e0<TODAY) continue;
    if(!['hawks','aubb','aufb'].includes(o.k)&&items.some(x=>x.key===o.n)) continue;
    const live=TODAY>=s0&&o.e;
    items.push({key:o.n,en:o.en,u:o.u,name:o.n,kind:o.k,start:live?TODAY:s0,realStart:s0,end:e0,live:!!live,tbd:!!o.tbd,t:o.t,label:o.tbd?'日期待定':(o.e?'至 '+(e0.getMonth()+1)+'/'+e0.getDate():null),sub:[o.t,o.p].filter(Boolean).join(' · '),isOne:true,note:o.p});
  }
  items.forEach(it=>{it.days=Math.round((it.start-TODAY)/DAY);});
  items.sort((a,b)=>a.days-b.days||(a.kind==='fest'?-1:1));
  return items;
}

  }
  const counts={all:items.length};items.forEach(i=>{const g=GROUP_OF(i.kind);counts[g]=(counts[g]||0)+1;});
  $('filters').innerHTML=[['all','全部'],...GROUPS].map(([k,v])=>'<button class="chip" type="button" data-k="'+k+'" aria-pressed="'+(filter===k)+'">'+(en?GROUPS_EN[k]:v)+'<span class="c">'+(counts[k]||0)+'</span></button>').join('');
  $('allyear').innerHTML='<b>'+L.allyear+'</b>'+(en?ALLYEAR_EN:ALLYEAR);
  $('allyear').hidden=!(filter==='all'||filter==='wh'||filter==='jz'||filter==='bj');
  const shown=items.filter(i=>filter==='all'||GROUP_OF(i.kind)===filter);
  const groups=new Map();
  for(const it of shown){const key=it.live?'live':it.start.getFullYear()+'-'+pad(it.start.getMonth()+1);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(it);}
  let html='';
  for(const [key,list] of groups){
    const head=key==='live'?L.liveHead:(en?MONL[+key.slice(5)-1]+' '+key.slice(0,4):(+key.slice(0,4))+' 年 '+(+key.slice(5))+' 月');
    html+='<div class="month"><h3>'+head+'<small>'+list.length+(en?(list.length===1?' event':' events'):' 项')+'</small></h3>';
    for(const it of list){
      const d=it.live?it.realStart:it.start;const lu=it.kind==='fest'?lunarOf(it.start):null;
      const dateTop=it.live?L.live:(d.getMonth()+1)+'/'+d.getDate();
      const soon=!it.live&&it.days<=7;
      const name=nm(it),note=nt(it);
      const isCn=!en&&(['fcn','fest','school','edu','fam'].includes(it.kind)||it.kind.startsWith('jz')||it.kind.startsWith('bj')||GROUP_OF(it.kind)==='wh');
      const href=it.u||((isCn?'https://www.baidu.com/s?wd=':'https://www.google.com/search?q=')+encodeURIComponent(name.replace(/（.*?）/g,' ')+' '+d.getFullYear()));
      const sub=[lu?lun(lu):'',it.isOne?(en?[tEn(it.t),note].filter(Boolean).join(' · '):it.sub):''].filter(Boolean).join(' · ');
      const right=it.live?'<b>●</b><span>'+L.now+'</span>'
        :it.days===0?'<b>'+L.today+'</b><span></span>'
        :'<b>'+it.days+'</b><span>'+(it.days===1?(en?'day':L.tomorrow):L.after)+'</span>';
      html+='<div tabindex="0" role="button" class="row'+(soon?' soon':'')+(it.kind==='fest'?' fest':'')+'" aria-expanded="false">'+
        '<div class="d"><b>'+dateTop+'</b><span>'+esc(subDate(it,d))+'</span></div>'+
        '<div class="t"><div class="name"><a class="go" href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(name)+'<span class="arr">'+(it.u?L.official:L.search)+'</span></a><span class="tag k-'+it.kind+'">'+(en?KINDS_EN[it.kind]:KINDS[it.kind])+'</span>'+(it.live?'<span class="live">'+L.live+'</span>':'')+'</div>'+
        '<div class="sub">'+esc(sub)+'</div>'+
        '<div class="more" hidden>'+(esc(note)||L.nonote)+'</div></div>'+
        '<div class="left">'+right+'</div></div>';
    }
    html+='</div>';
  }
  $('timeline').innerHTML=html||'<div class="empty">'+L.empty+'</div>';
}
$('filters').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;filter=b.dataset.k;try{localStorage.setItem('cal-filter',filter);}catch(e){}render();});
$('langBtn').addEventListener('click',()=>{lang=lang==='en'?'zh':'en';try{localStorage.setItem('bocheng-lang',lang);}catch(e){}render();});
$('timeline').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('row')){e.preventDefault();e.target.click();}});
$('timeline').addEventListener('click',e=>{if(e.target.closest('a'))return;const r=e.target.closest('.row');if(!r)return;const m=r.querySelector('.more');m.hidden=!m.hidden;r.setAttribute('aria-expanded',String(!m.hidden));});

render();
setInterval(()=>{if(ymd(todayLocal())!==ymd(TODAY))render();},60000);
})();
</script>
</body>
</html>
